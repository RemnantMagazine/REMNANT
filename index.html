<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://ghnjdfmnsmoiqdilsxzn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_bh-ZnMGseMcTzemZMq8QVQ_5mEXim9w";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    async function updateLoginLink() {

        const loginLink = document.getElementById("login-link");

        const { data: { user } } =
            await supabaseClient.auth.getUser();

        if (user) {

            const name = user.user_metadata?.name;

            if (name) {
                loginLink.textContent = name;
            }
        }
    }

    updateLoginLink();
</script>

<script>
async function loadArticles() {

    const { data, error } = await supabaseClient
        .from("Articles")
        .select("*")
        .eq("status", "published");

    if (error) {
        console.error("Could not load articles:", error);
        return;
    }

    // MAIN SHOWCASE
    const mainArticle = data.find(
        article => article.homepage_placement === "main-showcase"
    );

    const mainContainer = document.getElementById("main-showcase");

    if (mainArticle) {
        mainContainer.innerHTML = `
            <img src="${SUPABASE_URL}/storage/v1/object/public/article-images/${mainArticle.image_url}" 
                 alt="${mainArticle.title}">

            <div class="article-content">
                <h1>${mainArticle.title}</h1>

                <p class="standfirst">
                    ${mainArticle.standfirst}
                </p>

                <a href="article.html?slug=${mainArticle.slug}" class="read-more">
                    READ MORE
                </a>
            </div>
        `;
    }


    // NEW TRENDS
    const trendsArticle = data.find(
        article => article.homepage_placement === "new-trends"
    );

    const trendsContainer = document.getElementById("new-trends");

    if (trendsArticle) {
        trendsContainer.innerHTML = `
            <div class="second-image">
                <img src="${SUPABASE_URL}/storage/v1/object/public/article-images/${trendsArticle.image_url}" 
                     alt="${trendsArticle.title}">
            </div>

            <div class="second-content">
                <h2>${trendsArticle.title}</h2>

                <p class="standfirst">
                    ${trendsArticle.standfirst}
                </p>

                <a href="article.html?slug=${trendsArticle.slug}" class="read-more">
                    READ MORE
                </a>
            </div>
        `;
    }


    // COMING SOON
    const container = document.getElementById("coming-articles");

    const comingArticles = data.filter(
        article =>
            article.homepage_placement !== "main-showcase" &&
            article.homepage_placement !== "new-trends"
    );

    comingArticles.forEach(article => {

        const card = document.createElement("article");
        card.className = "coming-card";

        card.innerHTML = `
            <img src="${SUPABASE_URL}/storage/v1/object/public/article-images/${article.image_url}" 
                 alt="${article.title}">

            <h3>${article.title}</h3>

            <a href="article.html?slug=${article.slug}" class="read-more">
                READ MORE
            </a>
        `;

        container.appendChild(card);
    });
}

loadArticles();
</script>
