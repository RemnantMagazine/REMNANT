<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://ghnjdfmnsmoiqdilsxzn.supabase.co";

const SUPABASE_KEY = "sb_publishable_bh-ZnMGseMcTzemZMq8QVQ_5mEXim9w";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    }
);


// LOGIN NAME

async function updateLoginLink() {

    const loginLink = document.getElementById("login-link");

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {

        const name = session.user.user_metadata?.name;

        if (name) {
            loginLink.textContent = name;
        }

    }

}

updateLoginLink();


// LOAD FASHION NEWS

async function loadFashionNews() {

    const grid = document.getElementById("fashion-news-grid");

    const { data, error } = await supabaseClient
        .from("Articles")
        .select("*")
        .eq("category", "fashion-news")
        .eq("status", "published")
        .order("created_at", { ascending: false });


    if (error) {

    console.error("Could not load Fashion News:", error);

    grid.innerHTML = `
        <p>ERROR: ${error.message}</p>
    `;

    return;

}


    if (!data || data.length === 0) {

        grid.innerHTML = `
            <p class="no-articles">
                No Fashion News articles yet.
            </p>
        `;

        return;

    }


    grid.innerHTML = "";


    data.forEach(article => {

        const date = new Date(article.created_at).toLocaleDateString(
            "en-GB",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );


        const card = document.createElement("article");

        card.className = "fashion-news-card";


        card.innerHTML = `

            <img
                src="${SUPABASE_URL}/storage/v1/object/public/article-images/${article.image_url}"
                alt="${article.title}"
            >

            <p class="fashion-news-date">
                ${date}
            </p>

            <h2>
                ${article.title}
            </h2>

            <a
                href="article.html?slug=${article.slug}"
                class="fashion-news-read"
            >
                READ MORE
            </a>

        `;


        grid.appendChild(card);

    });

}


loadFashionNews();

</script>
