<script>
const SUPABASE_URL = "https://ghnjdfmnsmoiqdilsxzn.supabase.co";
const SUPABASE_KEY = "sb_publishable_bh-ZnMGseMcTzemZMq8QVQ_5mEXim9w";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function updateCanvasHeight() {

    const canvas = document.getElementById("design-canvas");

    if (!canvas) return;

    let requiredHeight = 850;

    const elements =
        canvas.querySelectorAll(".design-element");

    elements.forEach(function(element) {

        const top =
            parseFloat(element.style.top) || 0;

        const height =
            element.offsetHeight || 0;

        const bottom =
            top + height + 100;

        if (bottom > requiredHeight) {
            requiredHeight = bottom;
        }

    });

    canvas.style.height = requiredHeight + "px";
    canvas.style.minHeight = requiredHeight + "px";
}


/* =========================================================
   VISUAL ARTICLE BUILDER
========================================================= */

let selectedElement = null;
let highestZIndex = 1;

const canvas = document.getElementById("design-canvas");


function removeEmptyMessage() {
    const empty = canvas.querySelector(".empty-design");
    if (empty) empty.remove();
}


function showEmptyMessage() {
    if (!canvas.querySelector(".design-element")) {
        if (!canvas.querySelector(".empty-design")) {
            canvas.insertAdjacentHTML(
                "afterbegin",
                '<div class="empty-design">Add an element to start designing your article.</div>'
            );
        }
    }
}


/* =========================================================
   ADD ELEMENT
========================================================= */

function addElement(type, savedData = null) {

    removeEmptyMessage();

    const element = document.createElement("div");

    element.className = "design-element";
    element.dataset.type = type;

    element.style.left = savedData?.left || "60px";
    element.style.top = savedData?.top || `${60 + canvas.querySelectorAll(".design-element").length * 30}px`;
    element.style.width = savedData?.width || "420px";
    element.style.height = savedData?.height || (
        type === "heading" ? "100px" :
        type === "quote" ? "130px" :
        type === "image" ? "350px" :
        type === "spacer" ? "80px" : "150px"
    );

    element.style.zIndex = savedData?.zIndex || ++highestZIndex;


    let content = "";

    if (type === "text") {
        content = `
            <div class="element-content text-content"
                 contenteditable="true"
                 data-placeholder="Write your text..."></div>
        `;
    }

    if (type === "heading") {
        content = `
            <div class="element-content heading-content"
                 contenteditable="true"
                 data-placeholder="Enter heading..."></div>
        `;
    }

    if (type === "quote") {
        content = `
            <div class="element-content quote-content"
                 contenteditable="true"
                 data-placeholder="Enter quote..."></div>
        `;
    }

    if (type === "spacer") {
        content = `<div class="spacer-preview">SPACER</div>`;
    }

    if (type === "image") {
        content = `
            <div class="image-placeholder">
                <span>CHOOSE IMAGE</span>
                <input type="file" accept="image/*" class="design-image-input">
            </div>
        `;
    }


    element.innerHTML = `
        <div class="element-controls">

            <button type="button" data-action="bold"><strong>B</strong></button>
            <button type="button" data-action="italic"><em>I</em></button>
            <button type="button" data-action="underline"><u>U</u></button>

            <select data-action="fontSize">
                <option value="">SIZE</option>
                <option value="14px">14</option>
                <option value="16px">16</option>
                <option value="20px">20</option>
                <option value="28px">28</option>
                <option value="36px">36</option>
                <option value="48px">48</option>
                <option value="64px">64</option>
            </select>

            <select data-action="fontFamily">
                <option value="">FONT</option>
                <option value="Space Grotesk">SPACE</option>
                <option value="Archivo Black">ARCHIVO</option>
                <option value="Jura">JURA</option>
                <option value="Oswald">OSWALD</option>
                <option value="Georgia">GEORGIA</option>
            </select>

            <select data-action="textAlign">
                <option value="left">LEFT</option>
                <option value="center">CENTRE</option>
                <option value="right">RIGHT</option>
                <option value="justify">JUSTIFY</option>
            </select>

            <input type="color" value="#000000" data-action="color">

            <button type="button" data-action="back">↓</button>
            <button type="button" data-action="front">↑</button>
            <button type="button" data-action="duplicate">DUP</button>
            <button type="button" data-action="delete">×</button>

        </div>

        <div class="element-body">
            ${content}
        </div>

        <div class="resize-handle"></div>
    `;

    canvas.appendChild(element);

    applySavedStyles(element, savedData);
    attachElementEvents(element);

    if (savedData?.image) {
        const body = element.querySelector(".element-body");
        body.innerHTML = `
            <img src="${savedData.image}" alt="">
        `;
    }

   selectElement(element);

updateCanvasHeight();

return element;
}


/* =========================================================
   SAVED STYLES
========================================================= */

function applySavedStyles(element, data) {

    if (!data) return;

    const content = element.querySelector(".element-content");

    if (content) {
        content.innerHTML = data.text || "";

        if (data.textAlign) content.style.setProperty("text-align", data.textAlign, "important");
        if (data.fontSize) content.style.setProperty("font-size", data.fontSize, "important");
        if (data.fontFamily) content.style.setProperty("font-family", data.fontFamily, "important");
        if (data.fontWeight) content.style.setProperty("font-weight", data.fontWeight, "important");
        if (data.fontStyle) content.style.setProperty("font-style", data.fontStyle, "important");
        if (data.textDecoration) content.style.setProperty("text-decoration", data.textDecoration, "important");
        if (data.color) content.style.setProperty("color", data.color, "important");
    }
}


/* =========================================================
   SELECT ELEMENT
========================================================= */

function selectElement(element) {

    if (selectedElement) {
        selectedElement.classList.remove("selected");
    }

    selectedElement = element;

    if (selectedElement) {
        selectedElement.classList.add("selected");
        selectedElement.style.zIndex = ++highestZIndex;
    }
}


/* =========================================================
   ELEMENT EVENTS
========================================================= */

function attachElementEvents(element) {

    const controls = element.querySelector(".element-controls");

    element.addEventListener("mousedown", function(event) {

        if (event.target.closest(".element-content")) {
            return;
        }

        if (
            event.target.closest(".element-controls") ||
            event.target.closest(".resize-handle") ||
            event.target.closest("input") ||
            event.target.closest("textarea") ||
            event.target.closest("select") ||
            event.target.closest("button")
        ) {
            return;
        }

        selectElement(element);
        startDrag(event, element);
    });


    element.addEventListener("click", function(event) {

        if (!event.target.closest(".element-controls")) {
            selectElement(element);
        }
    });


    const imageInput = element.querySelector(".design-image-input");

    if (imageInput) {

        imageInput.addEventListener("change", function(event) {

            const file = event.target.files[0];

            if (!file) return;

            const reader = new FileReader();

            reader.onload = function(e) {

                const body = element.querySelector(".element-body");

                body.innerHTML = `
                    <img src="${e.target.result}" alt="">
                `;

                selectElement(element);
            };

            reader.readAsDataURL(file);
        });
    }


    if (controls) {

        controls.addEventListener("click", function(event) {

            const control = event.target.closest("[data-action]");

            if (!control) return;

            event.preventDefault();
            event.stopPropagation();

            const action = control.dataset.action;
            const content = element.querySelector(".element-content");


            if (action === "delete") {
                element.remove();
                selectedElement = null;
                showEmptyMessage();
                return;
            }


            if (action === "duplicate") {

                const data = elementToData(element);

                data.left =
                    (parseFloat(element.style.left) + 30) + "px";

                data.top =
                    (parseFloat(element.style.top) + 30) + "px";

                addElement(data.type, data);
                return;
            }


            if (action === "back") {

                element.style.zIndex =
                    Math.max(
                        1,
                        parseInt(element.style.zIndex || 1) - 1
                    );

                return;
            }


            if (action === "front") {
                element.style.zIndex = ++highestZIndex;
                return;
            }


            if (!content) return;


            if (action === "bold") {

                const current =
                    window.getComputedStyle(content).fontWeight;

                content.style.setProperty(
                    "font-weight",
                    current === "700" || current === "bold"
                        ? "400"
                        : "700",
                    "important"
                );

                return;
            }


            if (action === "italic") {

                const current =
                    window.getComputedStyle(content).fontStyle;

                content.style.setProperty(
                    "font-style",
                    current === "italic" ? "normal" : "italic",
                    "important"
                );

                return;
            }


            if (action === "underline") {

                const current =
                    window.getComputedStyle(content).textDecorationLine;

                content.style.setProperty(
                    "text-decoration",
                    current.includes("underline")
                        ? "none"
                        : "underline",
                    "important"
                );

                return;
            }

        });


        controls.addEventListener("change", function(event) {

            const control = event.target.closest("[data-action]");

            if (!control) return;

            event.stopPropagation();

            const action = control.dataset.action;
            const content = element.querySelector(".element-content");

            if (!content) return;


            if (action === "fontSize") {

                if (control.value) {
                    content.style.setProperty(
                        "font-size",
                        control.value,
                        "important"
                    );
                }

                return;
            }


            if (action === "fontFamily") {

                if (control.value) {
                    content.style.setProperty(
                        "font-family",
                        control.value,
                        "important"
                    );
                }

                return;
            }


            if (action === "textAlign") {

                content.style.setProperty(
                    "text-align",
                    control.value,
                    "important"
                );

                return;
            }


            if (action === "color") {

                content.style.setProperty(
                    "color",
                    control.value,
                    "important"
                );

                return;
            }

        });
    }


    const resizeHandle =
        element.querySelector(".resize-handle");


    if (resizeHandle) {

        resizeHandle.addEventListener(
            "mousedown",
            function(event) {

                event.preventDefault();
                event.stopPropagation();

                selectElement(element);

                startResize(event, element);
            }
        );
    }
}

/* =========================================================
   DRAGGING
========================================================= */

function startDrag(event, element) {

    event.preventDefault();

    const startX = event.clientX;
    const startY = event.clientY;

    const startLeft =
        parseFloat(element.style.left) || 0;

    const startTop =
        parseFloat(element.style.top) || 0;


    function move(e) {

        let left =
            startLeft + (e.clientX - startX);

        let top =
            startTop + (e.clientY - startY);


        const maxLeft =
            canvas.clientWidth - element.offsetWidth;


        left =
            Math.max(
                0,
                Math.min(left, maxLeft)
            );


        top =
            Math.max(0, top);


        element.style.left =
            left + "px";

        element.style.top =
            top + "px";


        updateCanvasHeight();
    }


    function stop() {

        document.removeEventListener(
            "mousemove",
            move
        );

        document.removeEventListener(
            "mouseup",
            stop
        );

        updateCanvasHeight();
    }


    document.addEventListener(
        "mousemove",
        move
    );

    document.addEventListener(
        "mouseup",
        stop
    );
}

/* =========================================================
   RESIZING
========================================================= */

function startResize(event, element) {

    const startX = event.clientX;
    const startY = event.clientY;

    const startWidth =
        element.offsetWidth;

    const startHeight =
        element.offsetHeight;


    function resize(e) {

        const width =
            Math.max(
                120,
                startWidth + e.clientX - startX
            );

        const height =
            Math.max(
                60,
                startHeight + e.clientY - startY
            );


        element.style.width =
            width + "px";

        element.style.height =
            height + "px";


        updateCanvasHeight();
    }


    function stop() {

        document.removeEventListener(
            "mousemove",
            resize
        );

        document.removeEventListener(
            "mouseup",
            stop
        );

        updateCanvasHeight();
    }


    document.addEventListener(
        "mousemove",
        resize
    );

    document.addEventListener(
        "mouseup",
        stop
    );
}


/* =========================================================
   SERIALISE DESIGN
========================================================= */

function elementToData(element) {

    const content = element.querySelector(".element-content");
    const image = element.querySelector(".element-body img");

    return {
        type: element.dataset.type || "text",

        left: element.style.left,
        top: element.style.top,
        width: element.style.width,
        height: element.style.height,
        zIndex: element.style.zIndex || "1",

        text: content ? content.innerHTML : "",

        textAlign: content?.style.textAlign || "left",
        fontSize: content?.style.fontSize || "",
        fontFamily: content?.style.fontFamily || "",
        fontWeight: content?.style.fontWeight || "",
        fontStyle: content?.style.fontStyle || "",
        textDecoration: content?.style.textDecoration || "",
        color: content?.style.color || "",

        image: image ? image.src : ""
    };

}


function getDesignData() {

    const elements = [];

    document
        .querySelectorAll("#design-canvas .design-element")
        .forEach(element => {

            elements.push(elementToData(element));

        });

    return JSON.stringify(elements);

}


/* =========================================================
   SAVE / PUBLISH
========================================================= */

async function uploadDesignImages() {

    const elements = document.querySelectorAll(
        "#design-canvas .design-element"
    );

    for (const element of elements) {

        const image = element.querySelector(".element-body img");

        if (!image) continue;

        if (!image.src.startsWith("data:image/")) continue;

        const response = await fetch(image.src);
        const blob = await response.blob();

        const fileName =
            "design-" +
            Date.now() +
            "-" +
            Math.random().toString(36).slice(2) +
            ".png";

        const { data, error } =
            await supabaseClient
                .storage
                .from("article-images")
                .upload(fileName, blob);

        if (error) throw error;

        image.src =
            `${SUPABASE_URL}/storage/v1/object/public/article-images/${data.path}`;

    }

}


async function uploadHeroImage() {

    const file =
        document.getElementById("article-image").files[0];

    if (!file) return null;

    const fileName =
        Date.now() + "-" + file.name.replace(/\s+/g, "-");

    const { data, error } =
        await supabaseClient
            .storage
            .from("article-images")
            .upload(fileName, file);

    if (error) throw error;

    return data.path;

}


async function prepareHomepagePlacement(placement) {

    if (placement === "main-showcase") {

        const { error } =
            await supabaseClient
                .from("Articles")
                .update({ homepage_placement: "none" })
                .eq("homepage_placement", "main-showcase");

        if (error) throw error;
    }


    if (placement === "new-trends") {

        const { error } =
            await supabaseClient
                .from("Articles")
                .update({ homepage_placement: "none" })
                .eq("homepage_placement", "new-trends");

        if (error) throw error;
    }

}


async function saveArticle(status) {

    const title =
        document.getElementById("article-title").value.trim();

    const standfirst =
        document.getElementById("article-standfirst").value.trim();

    const category =
        document.getElementById("article-category").value;

    const slug =
        document.getElementById("article-slug").value.trim();

    const seoDescription =
        document.getElementById("article-description").value.trim();

    const homepagePlacement =
        document.getElementById("homepage-placement").value;


    if (!title) {
        alert("Please enter an article title.");
        return;
    }

    if (!slug) {
        alert("Please enter an article URL.");
        return;
    }


    try {

        await uploadDesignImages();

        const heroImagePath =
            await uploadHeroImage();

        await prepareHomepagePlacement(homepagePlacement);


        const { error } =
            await supabaseClient
                .from("Articles")
                .insert([{

                    title: title,
                    standfirst: standfirst,
                    category: category,
                    slug: slug,
                    seo_description: seoDescription,
                    image_url: heroImagePath,
                    content: getDesignData(),
                    homepage_placement: homepagePlacement,
                    status: status

                }]);


        if (error) throw error;


        alert(
            status === "published"
                ? "Article published!"
                : "Draft saved!"
        );


        window.location.href = "edit-articles.html";

    } catch (error) {

        console.error(error);

        alert(
            "Something went wrong: " +
            error.message
        );

    }

}


document
    .querySelector(".save-draft")
    .addEventListener("click", function() {

        saveArticle("draft");

    });


document
    .querySelector(".publish-article")
    .addEventListener("click", function() {

        saveArticle("published");

    });


/* Prevent accidental text selection while dragging */

document.addEventListener("selectstart", function(event) {

    if (
        event.target.closest(".design-element") &&
        !event.target.closest(".element-content")
    ) {
        event.preventDefault();
    }

});
</script>
</body>
