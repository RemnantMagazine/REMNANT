<script>
document.querySelector(".save-draft").addEventListener("click", async function() {

    const standfirst = document.getElementById("article-standfirst").value;
    const category = document.getElementById("article-category").value;
    const slug = document.getElementById("article-slug").value;

    const homepagePlacement = document.getElementById("homepage-placement").value;

    let imageUrl = null;

        const fileName = Date.now() + "-" + imageFile.name;

            .from("article-images")

function getDesignData() {

    const elements = [];

    document.querySelectorAll("#design-canvas .design-element").forEach(element => {

        const type = element.dataset.type || "text";

        const data = {
            type: type,
            left: element.style.left,
            top: element.style.top,
            width: element.style.width,
            height: element.style.height
        };

        const input = element.querySelector("input, textarea");

        if (input) {

            data.text = input.value;

            data.textAlign = input.style.textAlign || "left";

            data.fontSize = input.style.fontSize || "";
            data.fontFamily = input.style.fontFamily || "";
            data.fontWeight = input.style.fontWeight || "";
            data.fontStyle = input.style.fontStyle || "";
            data.textDecoration = input.style.textDecoration || "";
            data.color = input.style.color || "";

        }

       const image = element.querySelector("img");

if (image) {
    data.image = image.src;
    data.imagePath = element.dataset.imagePath || "";
}

        elements.push(data);
    });

    return JSON.stringify(elements);
}

element.appendChild(controls);

function makeDraggable(element, canvas) {
    

    let isDragging = false;

    let offsetX = 0;
    let offsetY = 0;

    const resizeHandle = element.querySelector(".resize-handle");

if (resizeHandle) {

    let isResizing = false;

    resizeHandle.addEventListener("mousedown", function(event) {

        event.preventDefault();
        event.stopPropagation();

        isResizing = true;

        const startX = event.clientX;
        const startY = event.clientY;

        const startWidth = element.offsetWidth;
        const startHeight = element.offsetHeight;

        function resize(event) {

            if (!isResizing) return;

            const newWidth =
                startWidth + (event.clientX - startX);

            const newHeight =
                startHeight + (event.clientY - startY);

            element.style.width =
                Math.max(120, newWidth) + "px";

            element.style.height =
                Math.max(50, newHeight) + "px";
        }

        function stopResize() {

            isResizing = false;

            document.removeEventListener("mousemove", resize);
            document.removeEventListener("mouseup", stopResize);
        }

        document.addEventListener("mousemove", resize);
        document.addEventListener("mouseup", stopResize);

    });
}


    element.addEventListener("mousedown", function(event) {

      if (
    event.target.closest(".element-controls") ||
    event.target.tagName === "INPUT" ||
    event.target.tagName === "TEXTAREA" ||
    event.target.tagName === "SELECT" ||
    event.target.tagName === "BUTTON"
) {
    return;
}

        isDragging = true;

        const elementRect = element.getBoundingClientRect();

        offsetX = event.clientX - elementRect.left;
        offsetY = event.clientY - elementRect.top;

        element.style.zIndex = 1000;

    });


    document.addEventListener("mousemove", function(event) {

        if (!isDragging) return;

        const canvasRect = canvas.getBoundingClientRect();

        let newLeft =
            event.clientX - canvasRect.left - offsetX;

        let newTop =
            event.clientY - canvasRect.top - offsetY;


        const maxLeft =
            canvas.clientWidth - element.offsetWidth;

        const maxTop =
            canvas.clientHeight - element.offsetHeight;


        newLeft = Math.max(
            0,
            Math.min(newLeft, maxLeft)
        );

        newTop = Math.max(
            0,
            Math.min(newTop, maxTop)
        );


        element.style.left = newLeft + "px";
        element.style.top = newTop + "px";

    });


    document.addEventListener("mouseup", function() {

        if (isDragging) {

            isDragging = false;

            element.style.zIndex = "";

        }

    });

}
