<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Article | Remnant</title>
<link rel="stylesheet" href="script.css">
<style>
.design-builder{width:100%;margin-top:30px}
.design-toolbar{position:sticky;top:15px;z-index:1000;display:flex;gap:8px;flex-wrap:wrap;padding:14px;background:#111;border-radius:10px;margin-bottom:25px}
.design-toolbar button{background:#fff;color:#000;border:0;padding:11px 16px;border-radius:4px;font-family:"Space Grotesk",sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.design-canvas{width:100%;box-sizing:border-box}
.empty-design{padding:55px 30px;border:2px dashed #aaa;background:#fafafa;color:#777;text-align:center;font:12px "Space Grotesk",sans-serif}
.design-element{position:relative;width:100%;margin:0;padding:24px;background:#fff;border:2px solid transparent;box-sizing:border-box}
.design-element:hover,.design-element.selected{border-color:#111;box-shadow:5px 5px 0 #ddd}
.element-body{width:100%;box-sizing:border-box}
.element-content{width:100%;min-height:35px;outline:none;border:0;background:transparent;font-family:"Space Grotesk",sans-serif;font-size:16px;line-height:1.6;color:#000;white-space:pre-wrap;overflow-wrap:break-word;box-sizing:border-box}
.element-content:empty:before{content:attr(data-placeholder);color:#999}
.heading-content{font-family:"Archivo Black",sans-serif;font-size:36px;line-height:1.05}
.quote-content{font-family:Georgia,serif;font-size:24px;font-style:italic;line-height:1.4}
.element-body>img{display:block;width:100%;height:auto;max-height:800px;object-fit:cover}
.image-placeholder{width:100%;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;border:1px dashed #aaa;background:#f7f7f7;font:11px "Space Grotesk",sans-serif;letter-spacing:1px;box-sizing:border-box}
.spacer-element{padding:10px 24px}
.spacer-preview{width:100%;display:flex;align-items:center;justify-content:center;border:1px dashed #aaa;background:#f5f5f5;color:#888;font:10px "Space Grotesk",sans-serif;letter-spacing:1px;box-sizing:border-box}
.spacer-controls{display:flex;align-items:center;gap:10px;margin-top:12px;font:11px "Space Grotesk",sans-serif}
.spacer-controls select,.spacer-controls input{padding:7px 9px;border:1px solid #aaa;background:#fff;font:11px "Space Grotesk",sans-serif}
.element-controls{position:absolute;top:-42px;left:0;display:flex;align-items:center;gap:3px;padding:5px;background:#000;border-radius:4px;z-index:100;white-space:nowrap;opacity:0;pointer-events:none}
.design-element.selected .element-controls,.design-element:hover .element-controls{opacity:1;pointer-events:auto}
.element-controls button,.element-controls select,.element-controls input[type=color]{height:28px;border:0;border-radius:3px;background:#fff;color:#000;font:10px "Space Grotesk",sans-serif;cursor:pointer}
.element-controls button{min-width:28px;padding:0 7px}.element-controls select{padding:0 6px}.element-controls input[type=color]{width:32px;padding:2px}
@media(max-width:700px){.design-toolbar{top:8px}.design-toolbar button{flex:1 1 auto;padding:10px 11px;font-size:10px}.design-element{padding:18px}.heading-content{font-size:28px}.quote-content{font-size:20px}.element-controls{position:relative;top:auto;left:auto;width:100%;margin-bottom:15px;flex-wrap:wrap}.design-element.selected .element-controls,.design-element:hover .element-controls{display:flex}}
</style>
</head>
<body>
<nav>
<a href="index.html" class="logo">REMNANT</a>
<div class="NavLinks"><a href="FashionNew.html">Fashion News</a><a href="PeopleInFashion.html">People In Fashion</a><a href="FashionExplained.html">Fashion Explained</a></div>
<a href="admin.html" class="login-link">Admin</a>
</nav>
<main class="create-article-page">
<h1>CREATE ARTICLE</h1><p>Build a new article for Remnant.</p>
<label>ARTICLE TITLE</label><input type="text" id="article-title" placeholder="Enter your article title">
<label>HERO IMAGE</label><input type="file" id="article-image" accept="image/*">
<label>ARTICLE CATEGORY</label><select id="article-category"><option value="fashion-news">Fashion News</option><option value="people-in-fashion">People In Fashion</option><option value="fashion-explained">Fashion Explained</option></select>
<label>HOMEPAGE PLACEMENT</label><select id="homepage-placement"><option value="none">Don't feature on homepage</option><option value="main-showcase">Main Event</option><option value="new-trends">New Trends</option></select>
<label>SEO DESCRIPTION</label><textarea id="article-description" rows="3"></textarea>
<label>ARTICLE URL</label><input type="text" id="article-slug" placeholder="e.g. animal-print-winter-2026">
<label>ARTICLE STATUS</label><select id="article-status"><option value="draft">Draft</option><option value="published">Published</option></select>
<label>STANDFIRST</label><textarea id="article-standfirst" rows="4"></textarea>
<label>ARTICLE DESIGN</label>
<div class="design-builder">
<div class="design-toolbar">
<button type="button" id="add-text">+ TEXT</button><button type="button" id="add-heading">+ HEADING</button><button type="button" id="add-image">+ IMAGE</button><button type="button" id="add-quote">+ QUOTE</button><button type="button" id="add-spacer">+ SPACER</button>
</div>
<div id="design-canvas" class="design-canvas"><div class="empty-design">Add an element to start designing your article.</div></div>
</div>
<div class="article-actions"><button type="button" class="save-draft">SAVE DRAFT</button><button type="button" class="publish-article">PUBLISH ARTICLE</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ghnjdfmnsmoiqdilsxzn.supabase.co";
const SUPABASE_KEY="sb_publishable_bh-ZnMGseMcTzemZMq8QVQ_5mEXim9w";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const canvas=document.getElementById("design-canvas");
let selectedElement=null;

function removeEmptyMessage(){const e=canvas.querySelector(".empty-design");if(e)e.remove();}
function showEmptyMessage(){if(!canvas.querySelector(".design-element"))canvas.innerHTML='<div class="empty-design">Add an element to start designing your article.</div>';}

function controlsHTML(){
return '<div class="element-controls">'+
'<button type="button" data-action="bold"><strong>B</strong></button>'+
'<button type="button" data-action="italic"><em>I</em></button>'+
'<button type="button" data-action="underline"><u>U</u></button>'+
'<select data-action="fontSize"><option value="">SIZE</option><option value="14px">14</option><option value="16px">16</option><option value="20px">20</option><option value="28px">28</option><option value="36px">36</option><option value="48px">48</option><option value="64px">64</option></select>'+
'<select data-action="fontFamily"><option value="">FONT</option><option value="Space Grotesk">SPACE</option><option value="Archivo Black">ARCHIVO</option><option value="Jura">JURA</option><option value="Oswald">OSWALD</option><option value="Georgia">GEORGIA</option></select>'+
'<select data-action="textAlign"><option value="left">LEFT</option><option value="center">CENTRE</option><option value="right">RIGHT</option><option value="justify">JUSTIFY</option></select>'+
'<input type="color" value="#000000" data-action="color">'+
'<button type="button" data-action="moveUp">↑</button><button type="button" data-action="moveDown">↓</button>'+
'<button type="button" data-action="duplicate">DUP</button><button type="button" data-action="delete">×</button></div>';
}

function contentHTML(type){
if(type==="text")return '<div class="element-content text-content" contenteditable="true" data-placeholder="Write your text..."></div>';
if(type==="heading")return '<div class="element-content heading-content" contenteditable="true" data-placeholder="Enter heading..."></div>';
if(type==="quote")return '<div class="element-content quote-content" contenteditable="true" data-placeholder="Enter quote..."></div>';
if(type==="image")return '<div class="image-placeholder"><span>CHOOSE IMAGE</span><input type="file" accept="image/*" class="design-image-input"></div>';
if(type==="spacer")return '<div class="spacer-preview" style="height:50px">50px SPACING</div><div class="spacer-controls"><label>SPACING</label><select class="spacing-control"><option value="25px">25px</option><option value="50px" selected>50px</option><option value="75px">75px</option><option value="100px">100px</option><option value="150px">150px</option><option value="200px">200px</option><option value="250px">250px</option><option value="300px">300px</option><option value="custom">CUSTOM</option></select><input class="custom-spacing" type="number" min="1" step="1" placeholder="px" style="display:none;width:80px"></div>';
return "";
}

function addElement(type,data=null,before=null){
removeEmptyMessage();
const el=document.createElement("div");
el.className="design-element";
el.dataset.type=type;
if(type==="spacer")el.classList.add("spacer-element");
el.innerHTML=controlsHTML()+'<div class="element-body">'+contentHTML(type)+"</div>";
if(before)canvas.insertBefore(el,before);else canvas.appendChild(el);
if(data)restoreElement(el,data);
attachElementEvents(el);
selectElement(el);
const editable=el.querySelector(".element-content");
if(editable&&!data)setTimeout(()=>editable.focus(),0);
return el;
}

function restoreElement(el,data){
const c=el.querySelector(".element-content");
if(c){
c.innerHTML=data.text||"";
if(data.textAlign)c.style.textAlign=data.textAlign;
if(data.fontSize)c.style.fontSize=data.fontSize;
if(data.fontFamily)c.style.fontFamily=data.fontFamily;
if(data.fontWeight)c.style.fontWeight=data.fontWeight;
if(data.fontStyle)c.style.fontStyle=data.fontStyle;
if(data.textDecoration)c.style.textDecoration=data.textDecoration;
if(data.color)c.style.color=data.color;
}
if(data.type==="image"&&data.image)el.querySelector(".element-body").innerHTML='<img src="'+data.image+'" alt="">';
if(data.type==="spacer"){
const spacing=data.spacing||"50px";
const preview=el.querySelector(".spacer-preview");
const select=el.querySelector(".spacing-control");
const custom=el.querySelector(".custom-spacing");
preview.style.height=spacing;
preview.textContent=spacing+" SPACING";
const presets=["25px","50px","75px","100px","150px","200px","250px","300px"];
if(presets.includes(spacing)){select.value=spacing;custom.style.display="none";}
else{select.value="custom";custom.style.display="inline-block";custom.value=parseInt(spacing,10)||50;}
el.dataset.spacing=spacing;
}
}

function selectElement(el){
document.querySelectorAll(".design-element").forEach(x=>x.classList.remove("selected"));
selectedElement=el;
if(el)el.classList.add("selected");
}

function setSpacerHeight(el,value){
const preview=el.querySelector(".spacer-preview");
if(!preview)return;
preview.style.height=value;
preview.textContent=value+" SPACING";
el.dataset.spacing=value;
}

function attachElementEvents(el){
el.addEventListener("click",e=>{if(!e.target.closest(".element-controls"))selectElement(el);});
const imageInput=el.querySelector(".design-image-input");
if(imageInput)imageInput.addEventListener("change",async e=>{
const file=e.target.files[0];if(!file)return;
try{
const fileName="design-"+Date.now()+"-"+file.name.replace(/\s+/g,"-");
const result=await supabaseClient.storage.from("article-images").upload(fileName,file);
if(result.error)throw result.error;
const pub=supabaseClient.storage.from("article-images").getPublicUrl(result.data.path);
el.dataset.imagePath=result.data.path;
el.querySelector(".element-body").innerHTML='<img src="'+pub.data.publicUrl+'" alt="">';
selectElement(el);
}catch(err){console.error(err);alert("Could not upload image: "+err.message);}
});
const spacing=el.querySelector(".spacing-control");
const custom=el.querySelector(".custom-spacing");
if(spacing)spacing.addEventListener("change",()=>{
if(spacing.value==="custom"){custom.style.display="inline-block";custom.focus();}
else{custom.style.display="none";setSpacerHeight(el,spacing.value);}
selectElement(el);
});
if(custom)custom.addEventListener("input",()=>{
const n=parseInt(custom.value,10);if(!isNaN(n)&&n>0)setSpacerHeight(el,n+"px");
});
const controls=el.querySelector(".element-controls");
controls.addEventListener("click",e=>{
const control=e.target.closest("[data-action]");if(!control)return;
e.preventDefault();e.stopPropagation();
const action=control.dataset.action;
const c=el.querySelector(".element-content");
if(action==="delete"){el.remove();selectedElement=null;showEmptyMessage();return;}
if(action==="moveUp"){const p=el.previousElementSibling;if(p&&p.classList.contains("design-element"))canvas.insertBefore(el,p);selectElement(el);return;}
if(action==="moveDown"){const n=el.nextElementSibling;if(n&&n.classList.contains("design-element"))canvas.insertBefore(n,el);selectElement(el);return;}
if(action==="duplicate"){const d=elementToData(el);addElement(d.type,d,el.nextElementSibling);return;}
if(!c)return;
if(action==="bold")c.style.fontWeight=getComputedStyle(c).fontWeight==="700"?"400":"700";
if(action==="italic")c.style.fontStyle=getComputedStyle(c).fontStyle==="italic"?"normal":"italic";
if(action==="underline")c.style.textDecoration=getComputedStyle(c).textDecorationLine.includes("underline")?"none":"underline";
});
controls.addEventListener("change",e=>{
const control=e.target.closest("[data-action]");if(!control)return;
const c=el.querySelector(".element-content");if(!c)return;
if(control.dataset.action==="fontSize")c.style.fontSize=control.value;
if(control.dataset.action==="fontFamily")c.style.fontFamily=control.value;
if(control.dataset.action==="textAlign")c.style.textAlign=control.value;
if(control.dataset.action==="color")c.style.color=control.value;
});
}

function elementToData(el){
const c=el.querySelector(".element-content");
const img=el.querySelector(".element-body img");
const spacing=el.querySelector(".spacing-control");
return {
type:el.dataset.type||"text",
text:c?c.innerHTML:"",
textAlign:c?c.style.textAlign:"",
fontSize:c?c.style.fontSize:"",
fontFamily:c?c.style.fontFamily:"",
fontWeight:c?c.style.fontWeight:"",
fontStyle:c?c.style.fontStyle:"",
textDecoration:c?c.style.textDecoration:"",
color:c?c.style.color:"",
image:img?img.src:"",
imagePath:el.dataset.imagePath||"",
spacing:el.dataset.spacing||(spacing?spacing.value:"")
};
}

function getDesignData(){
return JSON.stringify(Array.from(canvas.querySelectorAll(":scope > .design-element")).map(elementToData));
}

async function uploadHeroImage(){
const file=document.getElementById("article-image").files[0];
if(!file)return null;
const result=await supabaseClient.storage.from("article-images").upload(Date.now()+"-"+file.name.replace(/\s+/g,"-"),file);
if(result.error)throw result.error;
return result.data.path;
}

async function prepareHomepagePlacement(placement){
if(placement==="main-showcase"||placement==="new-trends"){
const result=await supabaseClient.from("Articles").update({homepage_placement:"none"}).eq("homepage_placement",placement);
if(result.error)throw result.error;
}
}

async function saveArticle(status){
const title=document.getElementById("article-title").value.trim();
const standfirst=document.getElementById("article-standfirst").value.trim();
const category=document.getElementById("article-category").value;
const slug=document.getElementById("article-slug").value.trim();
const seoDescription=document.getElementById("article-description").value.trim();
const homepagePlacement=document.getElementById("homepage-placement").value;
if(!title){alert("Please enter an article title.");return;}
if(!slug){alert("Please enter an article URL.");return;}
try{
const heroImagePath=await uploadHeroImage();
await prepareHomepagePlacement(homepagePlacement);
const result=await supabaseClient.from("Articles").insert([{
title:title,standfirst:standfirst,category:category,slug:slug,
seo_description:seoDescription,image_url:heroImagePath,
content:getDesignData(),homepage_placement:homepagePlacement,status:status
}]);
if(result.error)throw result.error;
alert(status==="published"?"Article published!":"Draft saved!");
window.location.href="edit-articles.html";
}catch(err){console.error(err);alert("Something went wrong: "+err.message);}
}

document.getElementById("add-text").addEventListener("click",()=>addElement("text"));
document.getElementById("add-heading").addEventListener("click",()=>addElement("heading"));
document.getElementById("add-image").addEventListener("click",()=>addElement("image"));
document.getElementById("add-quote").addEventListener("click",()=>addElement("quote"));
document.getElementById("add-spacer").addEventListener("click",()=>addElement("spacer"));
document.querySelector(".save-draft").addEventListener("click",()=>saveArticle("draft"));
document.querySelector(".publish-article").addEventListener("click",()=>saveArticle("published"));
document.addEventListener("mousedown",e=>{
if(e.target.closest(".design-element")||e.target.closest(".design-toolbar"))return;
document.querySelectorAll(".design-element").forEach(x=>x.classList.remove("selected"));
selectedElement=null;
});
</script>
</body>
</html>
