async function deleteArticle(id) {
    const confirmed = confirm("Are you sure you want to delete this article?");

    if (!confirmed) {
        return;
    }

    const { error } = await supabaseClient
        .from("Articles")
        .delete()
        .eq("id", id);

    if (error) {
        console.error("Could not delete article:", error);
        alert(error.message);
        return;
    }

    alert("Article deleted!");

    loadArticles();
}
