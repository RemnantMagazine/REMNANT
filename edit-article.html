<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Article | Remnant</title>
<link rel="stylesheet" href="script.css">
<style>

.article-code-box {
    display: block !important;
    width: 100% !important;
    min-height: 650px !important;

    box-sizing: border-box !important;

    margin: 0 !important;
    padding: 18px !important;

    background: #111111 !important;
    color: #ffffff !important;

    border: 2px solid #000000 !important;

    font-family: "Courier New", monospace !important;
    font-size: 14px !important;
    line-height: 1.5 !important;

    resize: vertical !important;

    cursor: text !important;

    pointer-events: auto !important;

    user-select: text !important;
    -webkit-user-select: text !important;

    white-space: pre !important;
    overflow: auto !important;

    position: relative !important;
    z-index: 100 !important;
}

.article-code-box:focus {
    outline: 2px solid #000000 !important;
    outline-offset: 2px !important;
}

.code-help {
    margin: 8px 0 12px;
    font-size: 14px;
    line-height: 1.5;
}

.preview-wrapper {
    width: 100%;
    margin-top: 30px;
    border: 1px solid #ddd;
    background: #fff;
}

.preview-heading {
    padding: 12px 16px;
    background: #111;
    color: #fff;
    font-family: "Space Grotesk", sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
}

#article-preview {
    display: block;
    width: 100%;
    min-height: 700px;
    border: 0;
    background: #fff;
}

#article-message {
    margin-top: 20px;
    font-family: "Space Grotesk", sans-serif;
}

</style>
</head>
<body>
<nav>
<a href="index.html" class="Logo">REMNANT</a>
<div class="NavLinks">
<a href="FashionNew.html">Fashion News</a>
<a href="PeopleInFashion.html">People In Fashion</a>
<a href="FashionExplained.html">Fashion Explained</a>
</div>
<a href="edit-articles.html" class="login-link">BACK</a>
</nav>
<main class="create-article-page">
<h1>EDIT ARTICLE</h1>
<p>Update your Remnant article.</p>
<form class="article-form" id="article-form">
<label for="article-title">ARTICLE TITLE</label>
<input type="text" id="article-title">
<label for="article-standfirst">STANDFIRST</label>
<textarea id="article-standfirst" rows="4"></textarea>
<label for="article-category">ARTICLE CATEGORY</label>
<select id="article-category">
<option value="fashion-news">Fashion News</option>
<option value="people-in-fashion">People In Fashion</option>
<option value="fashion-explained">Fashion Explained</option>
</select>
<label for="article-slug">ARTICLE URL</label>
<input type="text" id="article-slug">
<label for="article-description">SEO DESCRIPTION</label>
<textarea id="article-description" rows="3"></textarea>
<label for="article-status">ARTICLE STATUS</label>
<select id="article-status">
<option value="draft">Draft</option>
<option value="published">Published</option>
</select>
<label for="homepage-placement">HOMEPAGE PLACEMENT</label>
<select id="homepage-placement">
<option value="none">Don't feature on homepage</option>
<option value="main-showcase">Main Event</option>
<option value="new-trends">New Trends</option>
</select>
<label for="article-image">HERO IMAGE</label>
<input type="file" id="article-image" accept="image/*">
<label for="article-code">ARTICLE CODE</label>
<p class="code-help">Edit the complete article HTML and CSS here. Each article can have its own design. Keep it as an article fragment with HTML + CSS only — do not include html, head or body tags.</p>
<textarea
    id="article-code"
    class="article-code-box"
    spellcheck="false"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    wrap="off"
    placeholder="Your article HTML + CSS will load here..."
></textarea>
<button type="button" id="preview-button">ARTICLE PREVIEW</button>
<div class="preview-wrapper">
<div class="preview-heading">PREVIEW</div>
<iframe id="article-preview" title="Article preview"></iframe>
</div>
<div class="article-actions">
<button type="button" id="save-changes" class="publish-article">SAVE CHANGES</button>
</div>
<div id="article-message"></div>
</form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="edit-article.js"></script>
</body>
</html>
