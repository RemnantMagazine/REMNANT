<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remnant</title>
    <link rel="stylesheet" href="script.css">

    <style>
        /* VERTICAL ARTICLE BLOCKS */

        #article-content {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .public-block {
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .public-block-text,
        .public-block-heading,
        .public-block-quote {
            margin: 0;
            padding: 0;
            width: 100%;
            box-sizing: border-box;
        }

        .public-block-text {
            font-family: "Space Grotesk", sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }

        .public-block-heading {
            font-family: "Archivo Black", sans-serif;
            font-size: 36px;
            line-height: 1.05;
        }

        .public-block-quote {
            font-family: Georgia, serif;
            font-size: 24px;
            line-height: 1.4;
            font-style: italic;
        }

        .public-block-image {
            display: block;
            width: 100%;
            height: auto;
            max-height: 800px;
            object-fit: cover;
            margin: 0;
        }

        .public-block-spacer {
            width: 100%;
            display: block;
        }

        .dynamic-article > #article-title,
        .dynamic-article > #article-standfirst {
            display: none !important;
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html" class="logo">REMNANT</a>

    <div class="NavLinks">
        <a href="FashionNew.html">Fashion News</a>
        <a href="PeopleInFashion.html">People In Fashion</a>
        <a href="FashionExplained.html">Fashion Explained</a>
    </div>

    <a href="account.html" class="login-link" id="login-link">LOGIN</a>
</nav>

<main class="dynamic-article" id="article-page">

    <h1 id="article-title"></h1>

    <p id="article-standfirst" class="standfirst"></p>

    <div id="article-content"></div>

    <section class="comments-section">

        <h2>COMMENTS</h2>

        <div id="comments-list"></div>

        <div id="comment-form-container">
            <textarea
                id="comment-input"
                placeholder="Write a comment..."
                rows="4"></textarea>

            <button id="comment-submit">
                POST COMMENT
            </button>
        </div>

        <p id="comment-message"></p>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://ghnjdfmnsmoiqdilsxzn.supabase.co";

/*
    Paste your existing Supabase publishable key here.
*/
const SUPABASE_KEY = "sb_publishable_bh-ZnMGseMcTzemZMq8QVQ_5mEXim9w";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    }
);


/* LOGIN */

async function updateLoginLink() {

    const loginLink = document.getElementById("login-link");

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (user) {

        const name = user.user_metadata?.name;

        if (name) {
            loginLink.textContent = name;
        }
    }
}

updateLoginLink();


/* LOAD ARTICLE */

async function loadArticle() {

    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");

    if (!slug) {
        console.error("No article slug found.");
        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("Articles")
        .select("*")
        .eq("slug", slug)
        .eq("status", "published")
        .single();

    if (error) {
        console.error("Could not load article:", error);
        return;
    }


    document.title = data.title;

    document.getElementById("article-title").textContent =
        data.title;

    document.getElementById("article-standfirst").textContent =
        data.standfirst || "";


    const articleContent =
        document.getElementById("article-content");


    /*
        NEW VERTICAL BLOCK FORMAT

        Each item saved by the block editor becomes
        one block underneath the previous block.
    */

    try {

        const design = JSON.parse(data.content);

        if (Array.isArray(design) && design.length > 0) {

            articleContent.innerHTML = "";


            design.forEach(function(item) {

                const block =
                    document.createElement("div");

                block.className = "public-block";


                /* TEXT */

                if (item.type === "text") {

                    const text =
                        document.createElement("div");

                    text.className =
                        "public-block-text";

                    text.innerHTML =
                        item.text || "";

                    applyTextStyles(text, item);

                    block.appendChild(text);
                }


                /* HEADING */

                else if (item.type === "heading") {

                    const heading =
                        document.createElement("h2");

                    heading.className =
                        "public-block-heading";

                    heading.innerHTML =
                        item.text || "";

                    applyTextStyles(heading, item);

                    block.appendChild(heading);
                }


                /* QUOTE */

                else if (item.type === "quote") {

                    const quote =
                        document.createElement("blockquote");

                    quote.className =
                        "public-block-quote";

                    quote.innerHTML =
                        item.text || "";

                    applyTextStyles(quote, item);

                    block.appendChild(quote);
                }


                /* IMAGE */

                else if (item.type === "image") {

                    if (item.image) {

                        const image =
                            document.createElement("img");

                        image.className =
                            "public-block-image";

                        image.src = item.image;

                        image.alt = data.title || "";

                        block.appendChild(image);
                    }
                }


                /* SPACER */

                else if (item.type === "spacer") {

                    const spacer =
                        document.createElement("div");

                    spacer.className =
                        "public-block-spacer";

                    const spacing =
                        item.spacing || "50px";

                    spacer.style.height =
                        spacing;

                    block.appendChild(spacer);
                }


                articleContent.appendChild(block);

            });

        } else {

            /*
                FALLBACK FOR OLDER ARTICLES
            */

            articleContent.innerHTML =
                data.content || "";

        }

    } catch (error) {

        console.error(
            "Could not load article blocks:",
            error
        );

        /*
            FALLBACK FOR OLDER ARTICLES
        */

        articleContent.innerHTML =
            data.content || "";
    }


    loadComments(data.id);
}


/* APPLY SAVED TEXT FORMATTING */

function applyTextStyles(element, item) {

    element.style.textAlign =
        item.textAlign || "left";

    if (item.fontSize) {
        element.style.fontSize =
            item.fontSize;
    }

    if (item.fontFamily) {
        element.style.fontFamily =
            item.fontFamily;
    }

    if (item.fontWeight) {
        element.style.fontWeight =
            item.fontWeight;
    }

    if (item.fontStyle) {
        element.style.fontStyle =
            item.fontStyle;
    }

    if (item.textDecoration) {
        element.style.textDecoration =
            item.textDecoration;
    }

    if (item.color) {
        element.style.color =
            item.color;
    }
}


loadArticle();


/* COMMENTS */

async function loadComments(articleId) {

    const commentsList =
        document.getElementById("comments-list");

    const {
        data,
        error
    } = await supabaseClient
        .from("comments")
        .select(
            "id, user_name, content, created_at, user_id"
        )
        .eq("article_id", articleId)
        .order("created_at", {
            ascending: true
        });

    if (error) {

        console.error(
            "Error loading comments:",
            error
        );

        return;
    }


    commentsList.innerHTML = "";


    if (data.length === 0) {

        commentsList.innerHTML = `
            <p class="no-comments">
                No comments yet. Be the first to comment.
            </p>
        `;

        return;
    }


    const {
        data: { session }
    } = await supabaseClient.auth.getSession();


    data.forEach(function(comment) {

        const date =
            new Date(comment.created_at)
                .toLocaleDateString(
                    "en-GB",
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );


        const canDelete =
            session &&
            session.user.id === comment.user_id;


        commentsList.innerHTML += `
            <div class="comment">

                <div class="comment-name">
                    ${comment.user_name || "Remnant Reader"}
                </div>

                <div class="comment-date">
                    ${date}
                </div>

                <p class="comment-text">
                    ${comment.content}
                </p>

                ${
                    canDelete
                        ? `<button class="delete-comment" data-id="${comment.id}">
                            DELETE
                           </button>`
                        : ""
                }

            </div>
        `;

    });


    document
        .querySelectorAll(".delete-comment")
        .forEach(function(button) {

            button.addEventListener(
                "click",
                async function() {

                    const commentId =
                        this.dataset.id;

                    const confirmed =
                        confirm(
                            "Are you sure you want to delete this comment?"
                        );

                    if (!confirmed) {
                        return;
                    }


                    const {
                        error
                    } = await supabaseClient
                        .from("comments")
                        .delete()
                        .eq("id", commentId);


                    if (error) {

                        console.error(
                            "Error deleting comment:",
                            error
                        );

                        return;
                    }


                    loadComments(articleId);

                }
            );

        });
}


/* POST COMMENT */

document
    .getElementById("comment-submit")
    .addEventListener(
        "click",
        async function() {

            const input =
                document.getElementById(
                    "comment-input"
                );

            const message =
                document.getElementById(
                    "comment-message"
                );

            const content =
                input.value.trim();


            if (!content) {

                message.textContent =
                    "Please write a comment first.";

                return;
            }


            const {
                data: { session }
            } =
                await supabaseClient.auth.getSession();


            if (!session) {

                message.textContent =
                    "Please log in to comment.";

                return;
            }


            const user =
                session.user;


            const name =
                user.user_metadata?.name ||
                "Remnant Reader";


            const params =
                new URLSearchParams(
                    window.location.search
                );

            const slug =
                params.get("slug");


            const {
                data: article,
                error: articleError
            } =
                await supabaseClient
                    .from("Articles")
                    .select("id")
                    .eq("slug", slug)
                    .single();


            if (articleError) {

                message.textContent =
                    "Could not find this article.";

                return;
            }


            const {
                error
            } = await supabaseClient
                .from("comments")
                .insert({
                    article_id: article.id,
                    user_id: user.id,
                    user_name: name,
                    content: content
                });


            if (error) {

                console.error(error);

                message.textContent =
                    error.message;

                return;
            }


            input.value = "";

            message.textContent =
                "Comment posted.";


            loadComments(article.id);

        }
    );
</script>

</body>
</html>
