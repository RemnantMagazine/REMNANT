<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REMNANT</title>

    <link rel="stylesheet" href="script.css">

    <style>

        /* -----------------------------------
           CUSTOM ARTICLE AREA
        ----------------------------------- */
#article-code-frame {
    display: block;
    width: 100%;
    min-height: 1000px;
    border: none;
    margin: 0;
    padding: 0;
    background: #ffffff;
}

        #article-loading {
            width: 100%;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Space Grotesk", sans-serif;
            font-size: 14px;
        }

    </style>

</head>


<body>


<nav>

    <a href="index.html" class="logo">
        REMNANT
    </a>

    <div class="NavLinks">

        <a href="FashionNew.html">
            Fashion News
        </a>

        <a href="PeopleInFashion.html">
            People In Fashion
        </a>

        <a href="FashionExplained.html">
            Fashion Explained
        </a>

    </div>

    <div class="account-links">

        <a
            href="account.html"
            class="login-link"
            id="login-link"
        >
            LOGIN
        </a>

    </div>

</nav>


<!--
    The article is deliberately kept separate
    from the main Remnant website CSS.
-->

<main id="article-code-content">

    <div id="article-loading">
        Loading article...
    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL = "https://ghnjdfmnsmoiqdilsxzn.supabase.co";

/*
    Keep your existing publishable key here.
*/
const SUPABASE_KEY = " sb_publishable_bh-ZnMGseMcTzemZMq8QVQ_5mEXim9w";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* -----------------------------------
   LOGIN
----------------------------------- */

async function updateLoginLink() {

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if (
        user &&
        user.user_metadata?.name
    ) {

        document.getElementById(
            "login-link"
        ).textContent =
            user.user_metadata.name;

    }

}


/* -----------------------------------
   LOAD ARTICLE
----------------------------------- */

async function loadArticle() {

    const slug =
        new URLSearchParams(
            location.search
        ).get("slug");


    if (!slug) {

        document.getElementById(
            "article-code-content"
        ).textContent =
            "Article not found.";

        return;

    }


    const {
        data,
        error
    } = await supabaseClient
        .from("Articles")
        .select("*")
        .eq("slug", slug)
        .eq("status", "published")
        .single();


    if (
        error ||
        !data
    ) {

        document.getElementById(
            "article-code-content"
        ).textContent =
            "Article not found.";

        return;

    }


    /* Update browser title */

    document.title =
        data.title +
        " | REMNANT";


    /*
        Create an iframe.

        This completely separates the article
        design from Remnant's main CSS.
    */

    const iframe =
        document.createElement("iframe");


    iframe.id =
        "article-code-frame";


    iframe.title =
        data.title;


    iframe.setAttribute(
        "scrolling",
        "no"
    );


    /*
        Allow the article to use its own
        complete width.
    */

    iframe.style.width =
        "100%";


    iframe.style.border =
        "none";


    iframe.style.display =
        "block";


    iframe.style.margin =
        "0";


    iframe.style.padding =
        "0";


    iframe.style.background =
        "#ffffff";


    /*
        Put the exact article code
        inside the iframe.
    */

    iframe.srcdoc = `

        <!DOCTYPE html>

        <html lang="en">

        <head>

            <meta charset="UTF-8">

            <meta
                name="viewport"
                content="width=device-width, initial-scale=1.0"
            >

            <style>

              html,
body {

    margin: 0;
    padding: 0 20px;
    width: 100%;
    min-height: 100%;

    background: #ffffff;

    box-sizing: border-box;

    overflow-x: auto;
}


                /*
                    Important:

                    The article is allowed to use
                    its own full available width.

                    Nothing from script.css can
                    interfere with it.
                */

                * {

                    box-sizing: border-box;

                }

            </style>

        </head>

        <body>

            ${data.content}

        </body>

        </html>

    `;


    /*
        Add iframe to page.
    */

    const container =
        document.getElementById(
            "article-code-content"
        );


    container.innerHTML = "";


    container.appendChild(
        iframe
    );


    /*
        Automatically resize the iframe
        to the height of the article.

        This prevents an iframe scrollbar
        appearing inside the article.
    */

    iframe.addEventListener(
        "load",
        function () {

            try {

                const articleDocument =
                    iframe.contentDocument ||
                    iframe.contentWindow.document;


                function resizeArticle() {

                    const height =
                        articleDocument.documentElement
                            .scrollHeight;


                    iframe.style.height =
                        Math.max(
                            height,
                            500
                        ) + "px";

                }


                resizeArticle();


                /*
                    Resize again shortly after loading
                    in case images change the height.
                */

                setTimeout(
                    resizeArticle,
                    100
                );


                setTimeout(
                    resizeArticle,
                    500
                );


                setTimeout(
                    resizeArticle,
                    1000
                );


                /*
                    Resize when images finish loading.
                */

                const images =
                    articleDocument.querySelectorAll(
                        "img"
                    );


                images.forEach(
                    function (image) {

                        image.addEventListener(
                            "load",
                            resizeArticle
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "Could not resize article:",
                    error
                );

            }

        }
    );

}


/* -----------------------------------
   START
----------------------------------- */

updateLoginLink();

loadArticle();

</script>


</body>

</html>
